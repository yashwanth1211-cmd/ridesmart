name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The API and the simulator share one schema in simulation_ml/db, so both
      # requirement files are needed. scikit-learn is deliberately NOT here -
      # it only serves the optional simulation_ml/eta_ml.py.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r database/requirements.txt
          pip install -r simulation_ml/requirements.txt

      # The API must import cleanly. This catches the class of bug where
      # database/main.py raises at import time and every API test errors out
      # with a confusing "could not import app" message.
      - name: Check the app imports
        run: python -c "import database.main; print('app import OK')"

      - name: Run the test suite
        run: python -m pytest tests_docs/tests -v

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # A build failure here is how the MapLibre default-export break and the
      # missing worker bundle were originally caught.
      - name: Build
        run: npm run build

  contract:
    name: API contract is intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract is the source of truth between the backend and frontend.
      # Editing it without editing the code - or the reverse - is exactly how
      # the missing "code" field on errors went unnoticed until Member 3 read
      # the response body.
      #
      # Parsed with a regex rather than PyYAML so this job needs no extra
      # dependency; the file is machine-written with stable 2-space indents.
      - name: Contract declares every endpoint the app serves
        run: |
          python - <<'PY'
          import re, sys
          text = open("tests_docs/api_contract.yaml", encoding="utf-8").read()
          declared = set(re.findall(r"^  (/api/[A-Za-z0-9_/{}.-]*):", text, re.M))
          required = {
              "/api/health", "/api/routes", "/api/routes/{route_id}/stops",
              "/api/routes/{route_id}/shape",
              "/api/stops", "/api/buses/active", "/api/routes/plan",
              "/api/trips/{trip_id}/eta", "/api/trips/{trip_id}/crowd",
              "/api/authority/dashboard", "/api/ws/buses",
          }
          missing = required - declared
          if missing:
              sys.exit(f"contract is missing required paths: {sorted(missing)}")
          print(f"contract declares all {len(required)} required paths")
          PY