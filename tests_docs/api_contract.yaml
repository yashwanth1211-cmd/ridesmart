openapi: 3.0.3

info:
  title: RideSmart API
  version: "0.1.0"
  description: >
    AI-Based Smart Public Transportation Platform.
    Real-time bus tracking, ETA prediction and crowd-aware route planning.

    OWNER: Member 2 (database/ - FastAPI application).
    CONTRACT OWNER: Member 5 (tests_docs/). Treat this file as the source of
    truth. If the code and this file disagree, that is a bug.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: meta
  - name: routes
  - name: tracking
  - name: planning
  - name: authority

paths:
  /api/health:
    get:
      tags: [meta]
      summary: Service health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /api/routes:
    get:
      tags: [routes]
      summary: List every route
      responses:
        "200":
          description: All routes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }

  /api/routes/{route_id}/stops:
    get:
      tags: [routes]
      summary: Ordered stops for a route
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Stops in travel order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RouteStop" }
        "404":
          description: Route not found

  /api/routes/{route_id}/shape:
    get:
      tags: [routes]
      summary: Real road geometry for a route
      description: >
        The route's OSRM road polyline in travel order. The map draws this and
        the simulator walks it, so the drawn line is the road the bus is on.
        Stop coordinates alone are not a route - adjacent stops can be
        kilometres apart with a lake or a park between them.
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Polyline vertices in travel order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteShape" }
        "404":
          description: Route not found

  /api/routes/{route_id}/live:
    get:
      tags: [routes]
      summary: One route's stops, geometry and live buses in a single response
      description: >
        Everything the live map needs to draw exactly ONE route. The map is
        scoped to the selected route, and returning that route's buses here -
        rather than a fleet-wide list the client has to filter - is what
        guarantees the map cannot draw another route's vehicles.

        A route with no active trip returns `buses: []` with a 200. That is a
        real answer, not a failure, so the client can tell "no service running"
        apart from "the request failed".
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Route-scoped map payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteLive" }
        "404":
          description: Route not found

  /api/stops:
    get:
      tags: [routes]
      summary: List every stop (used by the planner's from/to pickers)
      responses:
        "200":
          description: All stops
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stop" }

  /api/buses/active:
    get:
      tags: [tracking]
      summary: Latest known position of every active bus
      description: >
        Returns one entry per active trip. Frontend polls this every 2 seconds
        as a fallback if the WebSocket is unavailable.

        `route_id` is optional. Omitting it returns the whole fleet, which is
        what the fleet-wide panels use. Passing it narrows the response to one
        route, which is what the live map's polling fallback uses.
      parameters:
        - name: route_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Active buses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusPosition" }

  /api/buses/{bus_id}/location:
    get:
      tags: [tracking]
      summary: Latest position of one bus
      parameters:
        - name: bus_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusPosition" }
        "404":
          description: Bus not found

  /api/routes/plan:
    post:
      tags: [planning]
      summary: Plan a journey - the crowd-aware route planner
      description: >
        THE STANDOUT FEATURE. Returns MULTIPLE candidate routes, each scored on
        predicted ETA and crowding, so the passenger chooses the trade-off
        (faster but packed, vs slightly slower but empty).

        Seed data guarantees at least two options between any two seeded stops.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: Ranked journey options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResponse" }
        "400":
          description: Unknown stop code, or no route connects the two stops

  /api/journey:
    get:
      tags: [planning]
      summary: Direction-aware journey search - the BUSES you can actually catch
      description: >
        THE VEHICLE-LEVEL PLANNER, and the one the UI uses. Returns individual
        BUSES that serve both stops in the correct direction, not candidate routes.


        WHY THIS EXISTS ALONGSIDE /api/routes/plan
        -------------------------------------------
        The two endpoints answer different questions and only one of them is what
        someone standing at a stop needs:

          /api/routes/plan  "what are my trade-offs?" A route list. Compare one
                            corridor against another.
          /api/journey      "which bus do I physically catch?" A vehicle list. A
                            route list cannot answer this: it has no bus number, no
                            crowd reading for one vehicle, and it cannot tell a bus
                            two minutes away from one that left ten minutes ago.

        /api/routes/plan is kept because comparing corridors is a real product
        feature. It is just not the same question.


        DIRECTION IS ENFORCED PER BUS, NOT PER ROUTE
        ----------------------------------------------
        A route runs one way. An option is returned only when seq(from) < seq(to)
        in THAT vehicle's direction, so asking for Katpadi to VIT on a corridor
        that only runs VIT to Katpadi returns nothing rather than a bus going the
        wrong way.


        TWO ARRIVAL TIMES, DELIBERATELY
        --------------------------------
          arrives_in_min  until the bus reaches the BOARDING stop. What the
                          passenger is waiting on, and what ranking sorts by.
          eta_min         until it reaches the DESTINATION. What "arriving in N
                          minutes" means to someone choosing between buses.

        These are different numbers and collapsing them produced a card reading
        "arriving in 0 min" for a bus sitting AT the boarding stop while it was
        an hour from the destination.


        NO RESULTS IS A 200
        -------------------
        "Nothing connects these" is an answer, not a failure, so it returns 200
        with `message` set and both lists empty. The message distinguishes the
        cases that need different words on screen - same stop, wrong direction, or
        a transfer available - because suggesting a swap helps in one case and is
        nonsense in another. Only an unknown stop id is an error.
      parameters:
        - name: from_stop_id
          in: query
          required: true
          schema: { type: integer }
          description: Boarding stop id
          example: 4
        - name: to_stop_id
          in: query
          required: true
          schema: { type: integer }
          description: Destination stop id
          example: 9
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [eta, crowd], default: eta }
          description: >
            eta   arrival time ascending.
            crowd arrival time plus a crowding penalty
                  (low 0, medium 10, high 25 min), lower score first. This is the
                  answer to "I would rather wait than travel packed" and it has to
                  be a visible control rather than a hidden term.
        - name: accessibility_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Drop buses with no wheelchair access
        - name: include_transfers
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: >
            Include one-transfer suggestions when no direct bus exists. They are
            NOT offered alongside a direct option - suggesting a change to someone
            who can take one bus is noise.
        - name: horizon_min
          in: query
          required: false
          schema: { type: integer, default: 120, minimum: 10, maximum: 360 }
          description: How far ahead to consider departures
      responses:
        "200":
          description: >
            Matching buses, ranked. Both lists may be empty, in which case
            `message` explains why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyResponse" }
        "404":
          description: Unknown stop id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Missing or malformed query parameters

  /api/trips/{trip_id}/eta:
    get:
      tags: [planning]
      summary: Predicted arrival at each upcoming stop
      parameters:
        - name: trip_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Per-stop ETA
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StopEta" }

  /api/trips/{trip_id}/crowd:
    put:
      tags: [planning]
      summary: Manually set the crowd level for a trip
      description: >
        Driver/app override, and the DEMO TRIGGER: setting a bus to "low" and
        re-planning should visibly change the ranking of options.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [load]
              properties:
                load: { type: integer, minimum: 0, example: 12 }
                capacity: { type: integer, minimum: 1, example: 50 }
      responses:
        "200":
          description: Updated crowd estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrowdEstimate" }

  /api/authority/dashboard:
    get:
      tags: [authority]
      summary: KPIs for the transport authority
      responses:
        "200":
          description: Dashboard KPIs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }

  /api/ws/buses:
    get:
      tags: [tracking]
      summary: WebSocket stream of live bus positions
      description: >
        Pushes the same BusPosition array as /api/buses/active roughly every
        2 seconds. Clients must tolerate a heartbeat-only message.
      responses:
        "101":
          description: Switching protocols

components:
  schemas:

    Stop:
      type: object
      required: [id, code, name, lat, lon]
      properties:
        id: { type: integer, example: 1 }
        code: { type: string, example: STOP_VIT }
        name: { type: string, example: VIT }
        lat: { type: number, format: double, example: 12.968142 }
        lon: { type: number, format: double, example: 79.156252 }
        accessible: { type: boolean, example: true }
        kind:
          type: string
          enum: [transit, campus]
          default: transit
          description: >-
            'transit' = OSM maps a real bus stop / bus station / station here.
            'campus' = anchored at a landmark because no bay was surveyed
            there, which is the case for Kingston Engineering College.

    Route:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, example: 1 }
        code: { type: string, example: "V1" }
        name: { type: string, example: VIT - Bagayam }
        direction: { type: string, enum: [up, down], example: up }
        stop_count: { type: integer, example: 9 }

    ShapePoint:
      type: object
      required: [seq, lat, lon, cum_m]
      properties:
        seq: { type: integer, example: 0 }
        lat: { type: number, format: double, example: 12.968078 }
        lon: { type: number, format: double, example: 79.156234 }
        cum_m: { type: number, format: double, example: 0.0 }

    RouteShape:
      type: object
      required: [route_id, code, total_m, point_count, points]
      properties:
        route_id: { type: integer, example: 1 }
        code: { type: string, example: "V1" }
        total_m: { type: number, format: double, example: 15157.7 }
        point_count: { type: integer, example: 92 }
        points:
          type: array
          items: { $ref: "#/components/schemas/ShapePoint" }

    RouteLive:
      type: object
      description: >
        One route's map payload. `buses` is scoped to `route.id`; a route with
        no active trip returns an empty list rather than an error.
      required: [route, stops, shape, buses, generated_at]
      properties:
        route: { $ref: "#/components/schemas/Route" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/RouteStop" }
        shape: { $ref: "#/components/schemas/RouteShape" }
        buses:
          type: array
          description: Active buses on this route only. Empty if none are running.
          items: { $ref: "#/components/schemas/BusPosition" }
        generated_at: { type: string, format: date-time }

    RouteStop:
      type: object
      required: [seq, stop]
      properties:
        seq: { type: integer, description: Zero-based position in travel order }
        stop: { $ref: "#/components/schemas/Stop" }
        scheduled_offset_sec:
          type: integer
          description: Seconds from trip start to scheduled arrival here

    BusPosition:
      type: object
      required: [bus_id, bus_name, bus_reg, lat, lon, ts]
      properties:
        bus_id: { type: integer, example: 1 }
        bus_name:
          type: string
          description: >
            Short fleet reference a passenger can say out loud ("Bus 3"). Unique
            across the fleet. The registration identifies the vehicle; this is
            the label the UI leads with.
          example: Bus 3
        bus_reg: { type: string, example: TN09AB1234 }
        trip_id: { type: integer, example: 1 }
        route_id: { type: integer, example: 21 }
        route_code: { type: string, example: "V1" }
        lat: { type: number, format: double, example: 12.968078 }
        lon: { type: number, format: double, example: 79.156234 }
        heading: { type: number, description: Degrees from north }
        speed_kmph: { type: number, example: 28.4 }
        next_stop_name: { type: string, example: Katpadi Junction- Chittor Bus Stand }
        crowd_level: { type: string, enum: [low, med, high] }
        crowd_load: { type: integer, example: 35 }
        capacity: { type: integer, example: 50 }
        wheelchair_accessible: { type: boolean, example: true }
        low_floor: { type: boolean, example: true }
        ts: { type: string, format: date-time }

    PlanRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Stop code
          example: STOP_RAJAJINAGAR
        to:
          type: string
          description: Stop code
          example: STOP_MAJESTIC
        accessibility_only:
          type: boolean
          default: false
          description: When true, drop options with no wheelchair-accessible bus

    PlanResponse:
      type: object
      required: [from, to, options]
      properties:
        from: { $ref: "#/components/schemas/Stop" }
        to: { $ref: "#/components/schemas/Stop" }
        generated_at: { type: string, format: date-time }
        options:
          type: array
          description: >
            Always at least two for seeded stops. Ranked by ETA ascending.
            The UI must render every entry - showing one option defeats the
            purpose of the feature.
          items: { $ref: "#/components/schemas/PlanOption" }

    PlanOption:
      type: object
      description: ONE CANDIDATE ROUTE. The single most important object in the project.
      required:
        [route_id, code, eta_min, eta_predicted_min, delay_min,
         crowd_level, crowd_load, capacity, stops]
      properties:
        route_id: { type: integer, example: 21 }
        code: { type: string, example: "V1" }
        name: { type: string, example: VIT - Bagayam }
        eta_min:
          type: integer
          description: Minutes remaining using HISTORICAL segment times
          example: 15
        eta_scheduled_min:
          type: integer
          description: Minutes remaining per the published timetable
          example: 11
        eta_predicted_min:
          type: integer
          description: Alias of eta_min, kept for frontend clarity
          example: 15
        delay_min:
          type: integer
          description: eta_min minus eta_scheduled_min. Negative means early.
          example: 4
        crowd_level: { type: string, enum: [low, med, high] }
        crowd_load: { type: integer, example: 35 }
        capacity: { type: integer, example: 50 }
        crowd_ratio: { type: number, description: crowd_load / capacity, example: 0.7 }
        wheelchair_accessible: { type: boolean, example: true }
        low_floor: { type: boolean, example: true }
        score:
          type: number
          description: >
            Internal ranking score, lower is better.
            score = w_eta * eta_min + w_crowd * (crowd_ratio * 100)
          example: 23.5
        stops:
          type: array
          items: { $ref: "#/components/schemas/PlanStop" }

    PlanStop:
      type: object
      required: [stop_id, name, eta_min]
      properties:
        stop_id: { type: integer, example: 1 }
        name: { type: string, example: College }
        eta_min: { type: integer, example: 0 }
        accessible: { type: boolean, example: true }

    JourneyResponse:
      type: object
      required: [from, to, sort, direct, transfers]
      properties:
        from: { $ref: "#/components/schemas/Stop" }
        to: { $ref: "#/components/schemas/Stop" }
        sort:
          type: string
          enum: [eta, crowd]
          description: The ranking actually applied, echoed back
        generated_at: { type: string, format: date-time }
        direct:
          type: array
          description: >
            Buses that serve both stops in the correct direction. Every entry must
            be rendered - the ranking is a suggestion, not a decision made for the
            passenger. Capped at 24; a corridor with a four-minute headway would
            otherwise bury the useful rows.
          items: { $ref: "#/components/schemas/JourneyOption" }
        transfers:
          type: array
          description: One-transfer suggestions. Empty when a direct bus exists.
          items: { $ref: "#/components/schemas/JourneyWithTransfer" }
        message:
          type: string
          nullable: true
          description: >
            Why the direct list is empty, or null when it is not. Wording is
            meaningful and must be passed through rather than replaced: the same
            empty list needs "try swapping" for a wrong-direction pair and "you
            need a change of bus" when a transfer is offered.
          example: No direct bus runs that way. Try swapping the two stops.

    JourneyOption:
      type: object
      description: >
        ONE BUS that can take the passenger from `from` to `to`. Distinguished
        from PlanOption, which is a ROUTE, in three ways that matter:

          1. `option_id` identifies the VEHICLE (its trip), so two buses on one
             corridor are two options rather than one duplicated row.
          2. It carries a registration and a direction.
          3. `kind` distinguishes a bus being tracked now from a timetable
             departure that has no vehicle behind it yet. A scheduled entry has
             null delay and null crowding - reporting "on time" or "empty" for a
             bus that has not departed invents the readings the passenger is most
             likely to act on.
      required:
        [option_id, route_id, route_code, kind, direction, arrives_in_min,
         eta_min, journey_min, stops]
      properties:
        option_id:
          type: string
          description: >
            Stable id for this option. For a scheduled departure it embeds the
            departure timestamp, so two departures on one route cannot collide.
          example: "live:1842"
        kind: { type: string, enum: [live, scheduled] }
        route_id: { type: integer, example: 12 }
        route_code:
          type: string
          description: Directional route code, unique per direction
          example: "21A UP"
        route_number:
          type: string
          description: >
            The passenger-facing route number, shared by both directions. The code
            alone does not say which way the bus runs, which is why both are sent.
          example: "21A"
        route_name: { type: string, example: Vellore New Bus Stand - Katpadi }
        direction:
          type: string
          enum: [up, down]
          description: Load-bearing - it is what makes seq(from) < seq(to) meaningful
        bus_id:
          type: integer
          nullable: true
          description: null for a scheduled departure
        bus_name:
          type: string
          nullable: true
          description: >
            Short fleet reference ("Bus 3"), unique across the fleet. null for a
            scheduled departure, because no vehicle has been allocated yet.
          example: Bus 3
        bus_reg:
          type: string
          nullable: true
          description: Vehicle registration, e.g. TN09AB1234. null when scheduled.
        bus_type: { type: string, enum: [ordinary, express, deluxe] }
        arrives_in_min:
          type: integer
          description: >
            Minutes until the bus reaches the BOARDING stop. What the passenger is
            waiting on, and what the ranking sorts by.
          example: 4
        eta_min:
          type: integer
          description: >
            Minutes until the bus reaches the DESTINATION. This is the headline
            figure, and it is NOT the same number as arrives_in_min.
          example: 34
        journey_min:
          type: integer
          description: >
            Ride time from the timetable slice, boarding stop to destination.
            Independent of where the bus currently is.
          example: 30
        scheduled_arrival:
          type: string
          format: date-time
          nullable: true
          description: Per the timetable, in UTC
        predicted_arrival:
          type: string
          format: date-time
          nullable: true
          description: Scheduled arrival adjusted for observed delay
        delay_min:
          type: integer
          nullable: true
          description: >
            Observed minus scheduled, in minutes. Negative means running early.
            null when there is no vehicle to be late.
        departs_at:
          type: string
          format: date-time
          nullable: true
          description: Set for kind=scheduled only
        crowd_level:
          type: string
          enum: [low, med, high]
          nullable: true
          description: >
            Recomputed per request from the current load, not read from the stored
            Crowd row. That row is written at seed time from an off-peak profile
            and never rescaled, so trusting it let a full bus report "low" - the
            one mistake the crowd sort exists to prevent.
        crowd_load: { type: integer, nullable: true, example: 18 }
        capacity: { type: integer, example: 52 }
        crowd_ratio: { type: number, nullable: true, example: 0.346 }
        wheelchair_accessible: { type: boolean, example: true }
        low_floor: { type: boolean, example: true }
        score:
          type: number
          description: >
            Ranking score, lower is better.
            sort=eta   score = arrives_in_min
            sort=crowd score = eta_min + penalty(crowd_level),
                      where penalty is low 0, medium 10, high 25.
          example: 27.0
        stops:
          type: array
          description: >
            The stops between the two endpoints, inclusive of both, in travel
            order for this direction. Per-stop etas are measured from NOW at the
            boarding point, not from the route's first stop - otherwise the first
            entry reads as an hour away for a bus already at the kerb.
          items: { $ref: "#/components/schemas/JourneyStop" }

    JourneyStop:
      type: object
      required: [stop_id, name, eta_min]
      properties:
        stop_id: { type: integer, example: 4 }
        stop_code: { type: string, example: STOP_VIT }
        name: { type: string, example: VIT }
        seq:
          type: integer
          description: Sequence on THIS route, so order survives a reversal
          example: 3
        eta_min: { type: integer, example: 4 }
        accessible: { type: boolean, example: true }

    JourneyWithTransfer:
      type: object
      description: >
        A journey with one change of bus. Offered ONLY when no direct bus exists,
        and capped at a 40-minute wait so a "connection" is not really a wait for
        something else entirely.

        Note for the UI: these are not selectable. The map is scoped to exactly
        one route - that invariant is what stops a bus from an unselected route
        being drawn on it - and a transfer spans two. Showing one leg while
        implying both would be a lie; breaking the scoping would break the map.
      required: [legs, total_min, wait_min, transfers]
      properties:
        transfers: { type: integer, example: 1 }
        transfer_stop:
          $ref: "#/components/schemas/Stop"
        wait_min:
          type: integer
          description: Time between the first leg arriving and the second leaving
          example: 6
        total_min:
          type: integer
          description: >
            Boarding stop to destination, including the wait and an 8-minute
            interchange penalty.
          example: 88
        legs:
          type: array
          minItems: 2
          description: >
            Two entries, each travelling in its own correct direction - a transfer
            that needs a bus to reverse at the hub is not offered.
          items: { $ref: "#/components/schemas/JourneyLeg" }

    JourneyLeg:
      type: object
      required: [route_id, route_code, direction, arrives_in_min, stops]
      properties:
        route_id: { type: integer, example: 21 }
        route_code: { type: string, example: "301 UP" }
        route_number: { type: string, example: "301" }
        route_name: { type: string, example: Arakkonam - Vellore }
        direction: { type: string, enum: [up, down] }
        bus_id: { type: integer, nullable: true }
        bus_name: { type: string, nullable: true, example: Bus 3 }
        bus_reg: { type: string, nullable: true, example: TN09AB1060 }
        bus_type: { type: string, enum: [ordinary, express, deluxe] }
        arrives_in_min: { type: integer, example: 4 }
        crowd_level: { type: string, enum: [low, med, high], nullable: true }
        crowd_load: { type: integer, nullable: true, example: 30 }
        capacity: { type: integer, example: 50 }
        wheelchair_accessible: { type: boolean }
        stops:
          type: array
          items: { $ref: "#/components/schemas/JourneyStop" }

    StopEta:
      type: object
      required: [stop_id, scheduled_min, predicted_min]
      properties:
        stop_id: { type: integer, example: 2 }
        stop_name: { type: string, example: Main Road }
        scheduled_min:
          type: integer
          description: Per the timetable, relative to now
          example: 4
        predicted_min:
          type: integer
          description: Model output, relative to now
          example: 6
        delay_min: { type: integer, example: 2 }

    CrowdEstimate:
      type: object
      required: [trip_id, load, capacity, level]
      properties:
        trip_id: { type: integer, example: 1 }
        stop_id: { type: integer, example: 3 }
        load: { type: integer, example: 12 }
        capacity: { type: integer, example: 50 }
        ratio: { type: number, example: 0.24 }
        level: { type: string, enum: [low, med, high] }
        ts: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [total_buses, active_buses, delayed_buses]
      properties:
        total_buses: { type: integer, example: 4 }
        active_buses: { type: integer, example: 3 }
        delayed_buses: { type: integer, example: 1 }
        avg_delay_min: { type: number, example: 3.4 }
        high_demand_route: { type: string, example: "M1" }
        crowded_route: { type: string, example: "M1" }
        routes:
          type: array
          items:
            type: object
            properties:
              route_id: { type: integer }
              code: { type: string, example: "V1" }
              active_trips: { type: integer }
              avg_delay_min: { type: number }
              avg_crowd_ratio: { type: number }
              demand_score: { type: number }

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, example: Unknown stop code STOP_MARS }
        code: { type: string, example: unknown_stop }

# ---------------------------------------------------------------------------
# Conventions - follow these, they keep the five modules consistent.
# ---------------------------------------------------------------------------
conventions:
  base_path: /api
  time_format: ISO-8601 UTC with timezone suffix
  minutes_are_integers: true
  error_shape: '{ "detail": "human readable", "code": "machine_readable" }'
  crowd_thresholds:
    low: "load / capacity < 0.4"
    med: "0.4 <= load / capacity < 0.75"
    high: "load / capacity >= 0.75"
    note: >
      Seed values are chosen to hit every band: 35/50 = 0.70 (med),
      12/50 = 0.24 (low), 42/50 = 0.84 (high).
  ranking:
    note: >
      Options are returned sorted by eta_min ascending. The UI shows them
      side by side. We deliberately do NOT hide the slower-but-empty option.
  database:
    engine: SQLAlchemy
    dev_url: sqlite:///./ridesmart.db
    note: >
      ORM models are owned by Member 5 in simulation_ml/db/models.py while
      Member 4 is unavailable. Member 2 imports from there - do not fork them.